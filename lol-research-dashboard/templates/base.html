<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KashRock LoL Research{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #0d1117; color: #e6edf3; }
    header { padding: 14px 20px; border-bottom: 1px solid #21262d;
             display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    header a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    header nav a { font-weight: 400; font-size: 13px; }
    main { padding: 18px 20px; }
    .muted { color: #8b949e; }
    .error { background: #3d1d1d; border: 1px solid #f85149; color: #ffb3ad;
             padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
    .notice { background: #1c2733; border: 1px solid #1f6feb; color: #a8c7fa;
              padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }
    form.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end; }
    label { display: block; font-size: 11px; color: #8b949e; text-transform: uppercase;
            letter-spacing: .04em; margin-bottom: 3px; }
    select, input { background: #161b22; color: #e6edf3; border: 1px solid #30363d;
                    border-radius: 6px; padding: 7px 10px; font: inherit; min-width: 140px; }
    button { background: #238636; color: #fff; border: 0; border-radius: 6px;
             padding: 8px 16px; font: inherit; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #21262d;
             white-space: nowrap; }
    th { color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase;
         letter-spacing: .04em; }
    tr:hover td { background: #161b22; }
    .hit { color: #3fb950; } .miss { color: #f85149; } .push, .void { color: #d29922; }
    .num { font-variant-numeric: tabular-nums; }
    .pager { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .pager a { color: #58a6ff; text-decoration: none; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
             background: #21262d; border: 1px solid #30363d; }
    .card { border: 1px solid #21262d; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    img.team-logo { width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; }
  </style>
</head>
<body>
<header>
  <a href="/">KashRock LoL Research</a>
  <nav>
    <a href="/">Matches</a>
    <a href="/players">Players</a>
    <a href="/teams">Teams</a>
    <a href="/results">Results</a>
  </nav>
  <span class="muted" style="margin-left:auto">Live data from the KashRock API</span>
</header>
<main>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
